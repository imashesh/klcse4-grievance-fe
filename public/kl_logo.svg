<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="#fff" stroke="#c41e3a" stroke-width="2.5"/>
  <!-- Gear teeth around the circle -->
  <g fill="#1a1a1a">
    <rect x="47" y="2" width="6" height="10" rx="1"/>
    <rect x="47" y="88" width="6" height="10" rx="1"/>
    <rect x="2" y="47" width="10" height="6" rx="1"/>
    <rect x="88" y="47" width="10" height="6" rx="1"/>
    <rect x="14" y="10" width="6" height="10" rx="1" transform="rotate(45 17 15)"/>
    <rect x="80" y="10" width="6" height="10" rx="1" transform="rotate(-45 83 15)"/>
    <rect x="14" y="80" width="6" height="10" rx="1" transform="rotate(-45 17 85)"/>
    <rect x="80" y="80" width="6" height="10" rx="1" transform="rotate(45 83 85)"/>
  </g>
  <!-- KL Text -->
  <text x="50" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1a1a1a" letter-spacing="1">K L</text>
  <text x="50" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" font-weight="bold" fill="#c41e3a" letter-spacing="0.5">UNIVERSITY</text>
  <!-- Decorative line -->
  <line x1="28" y1="42" x2="72" y2="42" stroke="#c41e3a" stroke-width="0.8"/>
  <line x1="28" y1="55" x2="72" y2="55" stroke="#c41e3a" stroke-width="0.8"/>
  <!-- Motto text -->
  <text x="50" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#555" letter-spacing="0.3">KNOWLEDGE · LEADERSHIP</text>
  <text x="50" y="71" text-anchor="middle" font-family="Arial, sans-serif" font-size="4.5" fill="#555" letter-spacing="0.3">UNIVERSALITY</text>
</svg>
